<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#166534"/>
  
  <!-- Inner glow -->
  <rect x="40" y="40" width="944" height="944" rx="170" fill="#15803d" opacity="0.5"/>
  
  <!-- Tree trunk -->
  <rect x="462" y="620" width="100" height="180" rx="20" fill="#92400e"/>
  <rect x="442" y="770" width="140" height="40" rx="12" fill="#78350f"/>
  
  <!-- Tree body - large triangle -->
  <polygon points="512,180 780,680 244,680" fill="#4ade80"/>
  
  <!-- Tree body - middle layer -->
  <polygon points="512,260 730,600 294,600" fill="#22c55e"/>
  
  <!-- Tree body - top layer -->
  <polygon points="512,340 680,520 344,520" fill="#16a34a"/>
  
  <!-- Snow/shine highlights -->
  <polygon points="512,180 590,350 512,330" fill="rgba(255,255,255,0.15)"/>
  
  <!-- 360 text -->
  <text x="512" y="930" 
    font-family="Arial, sans-serif" 
    font-weight="900" 
    font-size="110" 
    fill="rgba(255,255,255,0.9)" 
    text-anchor="middle" 
    letter-spacing="8">360</text>
    
  <!-- Stars/dots -->
  <circle cx="280" cy="280" r="12" fill="rgba(255,255,255,0.4)"/>
  <circle cx="744" cy="320" r="8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="200" cy="450" r="6" fill="rgba(255,255,255,0.2)"/>
  <circle cx="820" cy="480" r="10" fill="rgba(255,255,255,0.25)"/>
</svg>